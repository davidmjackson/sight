  # ================= DRACO — TRICKY NEAR-MISS =================
  - team: Draco
    sprint: 14
    reported_status: green
    actual_status: green
    is_watermelon: false
    metrics: { committed_points: 36, completed_points: 33, carry_over_stories: 2, velocity: 33 }
    divergence_reasons: []
    moat_behaviours: []
    artifacts:
      - { id: status-draco-s14,        kind: status }
      - { id: raid-draco-s14,          kind: raid }
      - { id: burndown-draco-s14,      kind: burndown }
      - { id: slack-draco-s14-msg-001, kind: chat }
    expected_evidence: [burndown-draco-s14, status-draco-s14]

  - team: Draco
    sprint: 15
    reported_status: amber
    actual_status: amber
    is_watermelon: false
    # The trick: a late-sprint bug spike LOOKS alarming but is triaged and under control; the team
    # reports amber honestly. A detector must NOT call this a watermelon. Draco also owns the auth
    # API slip that Atlas depends on (jira-draco-s15-authapi) — the reconciliation counterpart.
    metrics: { committed_points: 36, completed_points: 29, carry_over_stories: 3, velocity: 29, late_bug_spike: 18 }
    divergence_reasons: []
    moat_behaviours: []
    decoy_signal: "late_bug_spike of 18 bugs, but triaged and burndown still on track -> resolves to amber, not red"
    artifacts:
      - { id: status-draco-s15,        kind: status, note: "honestly reports amber; mentions bug spike under control + auth API slip" }
      - { id: raid-draco-s15,          kind: raid,   note: "bug spike logged + triaged; Draco Auth API v2 slip logged (DRACO-412)" }
      - { id: burndown-draco-s15,      kind: burndown, note: "still broadly on track despite the spike" }
      - { id: bugspike-draco-s15,      kind: jira,   note: "THE alarming signal: 18 bugs raised late sprint" }
      - { id: triage-draco-s15,        kind: jira,   note: "evidence under control: triaged, severity-sorted, burndown OK, risk logged" }
      - { id: jira-draco-s15-authapi,  kind: jira,   note: "DRACO-412 Auth API v2 delivery slipped to Sprint 16 — reconciles the Atlas dependency" }
      - { id: slack-draco-s15-msg-001, kind: chat }
    expected_evidence: [bugspike-draco-s15, triage-draco-s15]
