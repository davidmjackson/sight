  - team: Cygnus
    sprint: 15
    reported_status: amber
    actual_status: amber
    is_watermelon: false
    metrics: { committed_points: 32, completed_points: 25, carry_over_stories: 3, velocity: 25 }
    divergence_reasons: []
    moat_behaviours: []
    artifacts:
      - { id: status-cygnus-s15,        kind: status, note: "openly reports amber + dependency slip + resourcing gap" }
      - { id: raid-cygnus-s15,          kind: raid,   note: "same slip logged honestly, owned, with mitigation" }
      - { id: burndown-cygnus-s15,      kind: burndown, note: "shows the slip honestly" }
