name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval,web]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      - name: Report-quality eval (SS-1.5) must be green
        run: python scripts/run_report_eval.py

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprintsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sprintsight
      # CI-only throwaway credentials for the least-privilege app role (slice 7). Not a real secret.
      APP_RW_PASSWORD: app_rw_ci_password
      APP_DATABASE_URL: postgresql://app_rw:app_rw_ci_password@localhost:5432/sprintsight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psql client + package
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -e ".[db]"

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d sprintsight -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Enable app_rw login (CI only; the real password lives in the deploy secret store)
        run: psql -h localhost -U postgres -d sprintsight -v ON_ERROR_STOP=1 -c "alter role app_rw with login password '$APP_RW_PASSWORD'"

      # Ingest + retrieve run as the least-privilege app_rw role (slice 7), i.e. the real production
      # path: a NON-superuser subject to RLS. This proves the app works under enforced isolation.
      - name: Ingest corpus (first pass — as app_rw under enforced RLS)
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: python scripts/ingest.py

      - name: Ingest corpus (second pass — must be idempotent)
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: |
          out=$(python scripts/ingest.py)
          echo "$out"
          echo "$out" | grep -q '"ingested": 0' || { echo "NOT IDEMPOTENT"; exit 1; }
          echo "$out" | grep -q '"skipped": 37' || { echo "EXPECTED 37 SKIPPED"; exit 1; }

      - name: Verify rows (37 artifacts, chunks embedded, teams linked)
        run: |
          psql -h localhost -U postgres -d sprintsight -v ON_ERROR_STOP=1 -c "do \$\$
          begin
            -- migration 0003 FORCEs RLS, so this owner session must announce its tenant first
            -- (the demo tenant the corpus is ingested under) or every count would be 0.
            perform set_config('app.tenant_id', '00000000-0000-0000-0000-000000000001', false);
            if (select count(*) from artifact) <> 37 then
              raise exception 'expected 37 artifacts, got %', (select count(*) from artifact);
            end if;
            if (select count(*) from chunk) = 0 then
              raise exception 'no chunks written';
            end if;
            if (select count(*) from chunk where embedding is null) > 0 then
              raise exception 'found chunks with null embedding';
            end if;
            if (select count(*) from team) <> 5 then
              raise exception 'expected 5 teams, got %', (select count(*) from team);
            end if;
            if (select count(*) from artifact where team_id is null) > 0 then
              raise exception 'found % artifacts with null team_id',
                (select count(*) from artifact where team_id is null);
            end if;
          end \$\$;"

      - name: Assert functional_id populated (verdict-off-DB slice)
        run: |
          out=$(psql -h localhost -U postgres -d sprintsight -v ON_ERROR_STOP=1 -tA -f db/checks/functional_id_present.sql)
          echo "null_functional_id|null_sprint: $out"
          echo "$out" | grep -qE '^0\|0$' || { echo "FAIL: artifacts with null functional_id or sprint (got: $out)"; exit 1; }

      - name: RLS tenant isolation (migration 0003 — cross-tenant no-leak proof)
        run: psql -h localhost -U postgres -d sprintsight -v ON_ERROR_STOP=1 -f db/checks/rls_isolation.sql

      - name: App role is subject to RLS (slice 7 — enforcement active for app_rw)
        env:
          PGPASSWORD: ${{ env.APP_RW_PASSWORD }}
        run: |
          # app_rw must NOT be able to bypass RLS.
          super=$(psql -h localhost -U app_rw -d sprintsight -tAc "select rolsuper or rolbypassrls from pg_roles where rolname = current_user")
          test "$super" = "f" || { echo "app_rw must not be superuser/bypassrls (got $super)"; exit 1; }
          # No tenant GUC -> fail closed (0 rows).
          n=$(psql -h localhost -U app_rw -d sprintsight -tAc "select count(*) from team")
          test "$n" = "0" || { echo "expected 0 teams without a tenant GUC, got $n"; exit 1; }
          # With the demo tenant set -> sees its 5 teams (RLS lets exactly this tenant through).
          n=$(psql -h localhost -U app_rw -d sprintsight -tAc "select set_config('app.tenant_id','00000000-0000-0000-0000-000000000001',false); select count(*) from team" | tail -1)
          test "$n" = "5" || { echo "expected 5 teams with the tenant GUC, got $n"; exit 1; }
          echo "app_rw is subject to RLS and tenant-scoped"

      - name: Retrieval smoke (pgvector search returns cited results — as app_rw)
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: python scripts/retrieve_smoke.py
