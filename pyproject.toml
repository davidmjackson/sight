[project]
name = "sprintsight"
version = "0.0.0"
description = "AI delivery-intelligence layer: audience-tuned cited status reports, risk detection, watermelon detector."
requires-python = ">=3.11"

# App dependencies (FastAPI, Anthropic SDK, pgvector, etc.) land in Stage 1.
# This skeleton declares only the dev tooling the CI needs.
[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
