[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintsight"
version = "0.0.0"
description = "AI delivery-intelligence layer: audience-tuned cited status reports, risk detection, watermelon detector."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
]

# App dependencies (FastAPI, Anthropic SDK, pgvector client, etc.) land in later Stage-1 stories.
[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8",
]
# Langfuse is the eval/observability backend; optional so evals run without it (see tracing.py).
eval = [
  "langfuse>=4",
]
# Postgres + pgvector client for ingestion against a real DB (psycopg imported lazily).
db = [
  "psycopg[binary]>=3",
]

[tool.setuptools.packages.find]
include = ["sprintsight*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
