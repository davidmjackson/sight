[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintsight"
version = "0.0.0"
description = "AI delivery-intelligence layer: audience-tuned cited status reports, risk detection, watermelon detector."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "anthropic>=0.40",
  "langgraph>=0.2",
]

# App dependencies (FastAPI, Anthropic SDK, pgvector client, etc.) land in later Stage-1 stories.
[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8",
]
# Langfuse is the eval/observability backend; optional so evals run without it (see tracing.py).
eval = [
  "langfuse>=4",
]
# Postgres + pgvector client for ingestion against a real DB (psycopg imported lazily).
db = [
  "psycopg[binary]>=3",
]
# Real in-region embedding model (decision D1). sentence-transformers is imported lazily in
# sprintsight/ingest/embedding.py (LocalEmbedder); CI + offline runs never need it. Opt in with
# SPRINTSIGHT_EMBEDDER=local. See docs/embedder/real-embedder.md.
embed = [
  "sentence-transformers>=3",
]
# Live connector runtime SDKs (imported lazily in sprintsight/connect/; tests never need them).
# Composio drives the live Jira read; PyGithub drives the live GitHub read. See
# docs/connectors/live-run.md for the one-step live-run commands. The exact Composio
# distribution is confirmed at install time (the SDK fetch path is not yet live-run).
connectors = [
  "composio>=0.16,<0.17",
  "PyGithub>=2",
]
# Stage 6 web app (FastAPI portfolio + watermelon drill-in). httpx is the test client;
# uvicorn runs the server locally and is not needed for the tests.
web = [
  "fastapi>=0.110",
  "jinja2>=3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "itsdangerous>=2",
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["sprintsight*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
